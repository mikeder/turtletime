name: zz-release-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello from $GITHUB_SHA" > probe_a.txt
      - uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: zz-probe
          name: zz-probe
          files: probe_a.txt
      - run: echo "second file" > probe_b.txt
      - uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: zz-probe
          name: zz-probe
          files: probe_b.txt
