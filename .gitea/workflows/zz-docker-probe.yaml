name: zz-docker-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker buildx version || true
          mkdir ctx && echo hello > ctx/index.html
          printf 'FROM nginx:alpine\nCOPY index.html /usr/share/nginx/html/\n' > ctx/Dockerfile
          REGISTRY=${GITHUB_SERVER_URL#https://}
          IMAGE=$REGISTRY/${GITHUB_REPOSITORY}:zz-probe
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" ctx
          docker push "$IMAGE"
